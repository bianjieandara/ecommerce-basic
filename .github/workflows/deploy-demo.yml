# Deploys the public demo store (https://ecommerce.relion-app.com) when main changes, or on demand from the Actions tab.
# It runs the same `deploy:client demo` the owner runs by hand: build, queues, remote D1 migrations, then the Worker.
name: Deploy demo

on:
  push:
    branches: [main]
    # The guide (docs-site/) is a separate Worker with its own deploy, and docs never change the store.
    paths-ignore:
      - 'docs/**'
      - 'docs-site/**'
      - '**/*.md'
  workflow_dispatch:

# One deploy at a time. deploy-client takes a lock for the same reason, and a newer push should wait, not cancel a deploy
# that is half-way through its migrations.
concurrency:
  group: deploy-demo
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # wrangler.jsonc is generated and gitignored; astro check needs it.
      - name: Generate the Worker config
        run: node scripts/use-client.mjs demo

      - name: Check
        run: npm run check

      # The demo has no accountId in client.jsonc, so deploy-client uses these variables as they are.
      #
      # `CLOUDFLARE_API_TOKEN` holds a Global API Key, not an API token, which is why every run died with
      # "Invalid format for Authorization header [code: 6111]": wrangler sends that variable as a bearer token,
      # and a Global API Key is not one. The key goes in `CLOUDFLARE_API_KEY` beside the account's e-mail
      # instead. The secret keeps its name because a secret's value cannot be read back to copy it elsewhere.
      # A scoped API token would be better than a Global API Key, which cannot be limited to this repository:
      # make one and this pair can go back to being a single `CLOUDFLARE_API_TOKEN`.
      - name: Deploy
        run: npm run deploy:client -- demo
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
