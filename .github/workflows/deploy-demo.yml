# Deploys the public demo store (https://ecommerce.relion-app.com) when main changes, or on demand from the Actions tab.
# It runs the same `deploy:client demo` the owner runs by hand: build, queues, remote D1 migrations, then the Worker.
name: Deploy demo

on:
  push:
    branches: [main]
    # The guide (docs-site/) is a separate Worker with its own deploy, and docs never change the store.
    paths-ignore:
      - 'docs/**'
      - 'docs-site/**'
      - '**/*.md'
  workflow_dispatch:

# One deploy at a time. deploy-client takes a lock for the same reason, and a newer push should wait, not cancel a deploy
# that is half-way through its migrations.
concurrency:
  group: deploy-demo
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # wrangler.jsonc is generated and gitignored; astro check needs it.
      - name: Generate the Worker config
        run: node scripts/use-client.mjs demo

      - name: Check
        run: npm run check

      # The demo has no accountId in client.jsonc, so deploy-client uses these variables as they are.
      #
      # The credential is read from one secret and handed to wrangler as whatever it turns out to be, because
      # the two kinds go in different variables and a secret's value cannot be read back to sort them out by
      # hand. A Global API Key is 37 hex characters and travels in `CLOUDFLARE_API_KEY` beside the account's
      # e-mail; an API token is longer and mixed-case and travels in `CLOUDFLARE_API_TOKEN`. Sending one as
      # the other is what produced "Invalid format for Authorization header [6111]" and, the other way round,
      # "[6103]" for X-Auth-Key. The value is trimmed first: a newline picked up while pasting the secret
      # breaks both headers, and Cloudflare answers the same way it does for a credential that is simply wrong.
      #
      # A scoped API token is better than a Global API Key, which cannot be limited to this repository or
      # revoked without breaking everything else signed with it.
      - name: Deploy
        shell: bash
        run: |
          credential="$(printf '%s' "$CF_CREDENTIAL" | tr -d '[:space:]')"
          if [ -z "$credential" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is empty."
            exit 1
          elif printf '%s' "$credential" | grep -qE '^[0-9a-f]{37}$'; then
            echo "Using the credential as a Global API Key."
            export CLOUDFLARE_API_KEY="$credential"
            export CLOUDFLARE_EMAIL="$CF_EMAIL"
          else
            echo "Using the credential as an API token."
            export CLOUDFLARE_API_TOKEN="$credential"
          fi
          npm run deploy:client -- demo
        env:
          CF_CREDENTIAL: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
